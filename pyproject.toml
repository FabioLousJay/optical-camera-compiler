[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-camera-compiler"
version = "3.9.4"
description = "Deterministic camera and optical compiler for zero-artifact photorealism in AI image generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Fabio De Pinho" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "Pillow>=10.3,<14",
    "numpy>=1.26,<3",
    "pytest>=7.0,<10",
]
upscale = [
    "Pillow>=10.3,<14",
    "numpy>=1.26,<3",
]
sr = [
    "Pillow>=10.3,<14",
    "numpy>=1.26,<3",
    "torch>=2.0",
]
all = [
    "Pillow>=10.3,<14",
    "numpy>=1.26,<3",
    "pytest>=7.0,<10",
]

[project.scripts]
optical-compiler = "optical_compiler.cli:main"
optical-studio = "optical_compiler.web:main"
optical-upscaler = "optical_compiler.cli:upscaler_main"
optical-recon-4x = "optical_compiler.cli:recon_4x_main"
optical-png-lock = "optical_compiler.cli:png_lock_main"
photonqc = "photonqc.cli:main"
photopipe = "photopipe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["optical_compiler*", "photonqc*", "photopipe*"]

[tool.setuptools.package-data]
optical_compiler = ["profiles_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
