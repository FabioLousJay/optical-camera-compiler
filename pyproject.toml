[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-camera-compiler"
version = "3.9.2"
description = "Deterministic camera and optical compiler for zero-artifact photorealism in AI image generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Fabio De Pinho" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
upscale = [
    "Pillow>=9.0",
]
all = [
    "Pillow>=9.0",
    "pytest>=7.0",
]

[project.scripts]
optical-compiler = "optical_compiler.cli:main"
optical-studio = "optical_compiler.web:main"
optical-upscaler = "optical_compiler.cli:upscaler_main"
optical-recon-4x = "optical_compiler.cli:recon_4x_main"
optical-png-lock = "optical_compiler.cli:png_lock_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["optical_compiler*"]

[tool.setuptools.package-data]
optical_compiler = ["profiles_data/*.json"]
