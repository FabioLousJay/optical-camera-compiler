[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-camera-compiler"
version = "0.1.0"
description = "Deterministic camera and optical compiler for zero-artifact photorealism in AI image generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Fabio De Pinho" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
optical-compiler = "optical_compiler.cli:main"
optical-studio = "optical_compiler.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["optical_compiler*"]
