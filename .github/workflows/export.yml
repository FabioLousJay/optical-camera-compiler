name: PhotonQC Print-Calibrated Export Pipeline

on:
  push:
    branches: [ main, master, "feature/**" ]
  workflow_dispatch:
    inputs:
      input_path:
        description: "Relative path to RGB source image in repository"
        required: true
        default: "examples/rights-cleared-example.png"
      width_in:
        description: "Target physical print width in inches"
        required: true
        default: "16"
      height_in:
        description: "Target physical print height in inches"
        required: true
        default: "24"
      ppi:
        description: "Target raster density (PPI)"
        required: true
        default: "300"
      min_mib:
        description: "Minimum lossless PNG size in MiB"
        required: true
        default: "8"
      profile:
        description: "Print calibration profile (matte_300ppi, glossy_300ppi, canvas_240ppi, baryta_300ppi)"
        required: false
        default: "matte_300ppi"

permissions:
  contents: read

jobs:
  export:
    name: Execute Verified Print Export & Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate Path & Execute Constraint-Verified Export
        env:
          INPUT_PATH: ${{ inputs.input_path || 'examples/rights-cleared-example.png' }}
          WIDTH_IN: ${{ inputs.width_in || '16' }}
          HEIGHT_IN: ${{ inputs.height_in || '24' }}
          PPI: ${{ inputs.ppi || '300' }}
          MIN_MIB: ${{ inputs.min_mib || '8' }}
          PRINT_PROFILE: ${{ inputs.profile || 'matte_300ppi' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path.cwd().resolve()
          candidate = (workspace / os.environ["INPUT_PATH"]).resolve()
          if not str(candidate).startswith(str(workspace)):
              raise ValueError(f"Path traversal blocked: {candidate}")
          if not candidate.is_file():
              raise FileNotFoundError(f"Input image not found: {candidate}")
          PY
          photonqc export \
            --input "$INPUT_PATH" \
            --output "outputs/export/verified_export.png" \
            --width-in "$WIDTH_IN" \
            --height-in "$HEIGHT_IN" \
            --ppi "$PPI" \
            --min-mib "$MIN_MIB" \
            --backend lanczos \
            --profile "$PRINT_PROFILE" \
            --output-sharpen \
            --report-dir "outputs/export/report"
          photonqc evaluate \
            --candidate "outputs/export/verified_export.png" \
            --check-heart \
            --check-flat-black \
            --report-dir "outputs/export/evaluation"

      - name: Upload Export Package & Cryptographic Provenance
        uses: actions/upload-artifact@v4
        with:
          name: photonqc-verified-export
          path: outputs/export/
          if-no-files-found: error
